# Alternative to run.sh / run.bat:   docker compose run --rm srt-translator
# Shares HOST_ROOT (default: your home folder) with the container.
services:
  srt-translator:
    build: .
    image: srt-translator
    stdin_open: true   # interactive prompts
    tty: true          # progress bars
    volumes:
      - ${HOST_ROOT:-${HOME}}:/host   # your files; .srt is written next to each video
      - srt-config:/config            # saved settings from the first-run setup
      - whisper-models:/models        # Whisper model cache (downloaded once)
    environment:
      - HOST_ROOT=${HOST_ROOT:-${HOME}}
      # Optional: pass API keys from your shell / .env instead of saving them
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama etc. running on the host

volumes:
  srt-config:
  whisper-models:
